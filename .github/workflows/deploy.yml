name: Deploy site
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx @11ty/eleventy   # builds to _site/

      - name: Inspect build output
        run: |
          echo "Eleventy output directory:"
          ls -la _site || true
          echo ""
          echo "Files in _site:"
          find _site -maxdepth 2 -type f | head -50 || true
          echo ""
          echo "File count:"
          find _site -type f | wc -l || true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Debug and sync site
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

          echo ""
          echo "Target bucket: ${{ vars.S3_BUCKET_NAME }}"
          echo "AWS region: ${{ vars.AWS_REGION }}"

          echo ""
          echo "Bucket currently contains:"
          aws s3 ls s3://${{ vars.S3_BUCKET_NAME }}/

          echo ""
          echo "Dry run:"
          aws s3 sync _site/ s3://${{ vars.S3_BUCKET_NAME }} --dryrun

          echo ""
          echo "Actual sync:"
          aws s3 sync _site/ s3://${{ vars.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public,max-age=0,must-revalidate"

          echo ""
          echo "Bucket after sync:"
          aws s3 ls s3://${{ vars.S3_BUCKET_NAME }}/

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"